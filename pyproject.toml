[tool.poetry]
name = "sd-regex-testing"
version = "0.1.0"
description = "A set of tools for testing SmokeDetector regexes"
authors = ["anerdw <yimandrew27@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
polars = "^1.6.0"

[tool.poetry.scripts]
sdrt = "sd_regex_testing.interactive:test_from_cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
